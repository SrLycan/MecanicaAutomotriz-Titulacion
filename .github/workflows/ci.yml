name: CI

# Se ejecuta en cada push/PR a main o master (cubre los dos nombres mas
# comunes de rama principal), y tambien se puede lanzar a mano desde la
# pestaña "Actions" de GitHub con "Run workflow".
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (instala + revisa sintaxis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar que todos los .js compilen sin errores de sintaxis
        run: find src -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Pruebas unitarias
        run: npm test

  frontend:
    name: Frontend (instala + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas unitarias
        run: CI=true npm test -- --watchAll=false

      - name: Compilar el proyecto (build de produccion)
        # CI=false evita que los warnings de ESLint (que no rompen nada real)
        # se traten como errores fatales del build, algo que create-react-app
        # hace por defecto cuando detecta la variable CI en el entorno.
        run: CI=false npm run build
